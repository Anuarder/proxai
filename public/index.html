<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Proxai</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=DM+Sans:wght@400;500;600&display=swap');

    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --bg-primary: #0a0a0c;
      --bg-secondary: #111115;
      --bg-tertiary: #18181e;
      --bg-input: #1a1a22;
      --border: #2a2a35;
      --border-focus: #4a4a5a;
      --text-primary: #e8e8ed;
      --text-secondary: #8888a0;
      --text-muted: #55556a;
      --accent: #00d4aa;
      --accent-dim: #00d4aa22;
      --accent-glow: #00d4aa40;
      --user-bg: #1a1a2e;
      --assistant-bg: #111118;
      --error: #ff4466;
      --error-dim: #ff446620;
      --mono: 'JetBrains Mono', monospace;
      --sans: 'DM Sans', sans-serif;
    }

    html, body {
      height: 100%;
      background: var(--bg-primary);
      color: var(--text-primary);
      font-family: var(--sans);
      -webkit-font-smoothing: antialiased;
    }

    body {
      display: flex;
      flex-direction: column;
    }

    /* ── Header ── */
    header {
      display: flex;
      align-items: center;
      gap: 16px;
      padding: 12px 20px;
      border-bottom: 1px solid var(--border);
      background: var(--bg-secondary);
      flex-shrink: 0;
    }

    .logo {
      font-family: var(--mono);
      font-weight: 700;
      font-size: 15px;
      letter-spacing: 0.05em;
      color: var(--accent);
      text-transform: uppercase;
      flex-shrink: 0;
    }

    .logo span {
      color: var(--text-muted);
      font-weight: 400;
    }

    .header-controls {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-left: auto;
    }

    .session-badge {
      font-family: var(--mono);
      font-size: 11px;
      color: var(--text-muted);
      background: var(--bg-tertiary);
      padding: 4px 10px;
      border-radius: 4px;
      border: 1px solid var(--border);
      display: none;
      max-width: 220px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .session-badge.visible { display: block; }

    select, input[type="password"] {
      font-family: var(--mono);
      font-size: 12px;
      background: var(--bg-input);
      color: var(--text-primary);
      border: 1px solid var(--border);
      border-radius: 4px;
      padding: 6px 10px;
      outline: none;
      transition: border-color 0.15s;
    }

    select:focus, input[type="password"]:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 2px var(--accent-dim);
    }

    select { min-width: 140px; cursor: pointer; }
    input[type="password"] { width: 160px; }

    /* ── Messages ── */
    .messages {
      flex: 1;
      overflow-y: auto;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .messages::-webkit-scrollbar { width: 6px; }
    .messages::-webkit-scrollbar-track { background: transparent; }
    .messages::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

    .empty-state {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 12px;
      color: var(--text-muted);
      font-size: 14px;
    }

    .empty-state .icon {
      font-size: 32px;
      opacity: 0.3;
    }

    .empty-state code {
      font-family: var(--mono);
      font-size: 12px;
      color: var(--text-secondary);
      background: var(--bg-tertiary);
      padding: 2px 8px;
      border-radius: 3px;
    }

    .msg {
      max-width: 780px;
      width: 100%;
      margin: 0 auto;
      padding: 16px 20px;
      border-radius: 6px;
      line-height: 1.65;
      font-size: 14px;
      animation: msg-in 0.2s ease-out;
    }

    @keyframes msg-in {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .msg.user {
      background: var(--user-bg);
      border-left: 3px solid var(--accent);
    }

    .msg.assistant {
      background: var(--assistant-bg);
      border-left: 3px solid var(--border);
      font-family: var(--mono);
      font-size: 13px;
      white-space: pre-wrap;
      word-break: break-word;
    }

    .msg .role-label {
      font-family: var(--mono);
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      margin-bottom: 6px;
      font-weight: 600;
    }

    .msg.user .role-label { color: var(--accent); }
    .msg.assistant .role-label { color: var(--text-muted); }

    .msg.error {
      background: var(--error-dim);
      border-left: 3px solid var(--error);
      color: var(--error);
      font-family: var(--mono);
      font-size: 13px;
    }

    .msg .cursor {
      display: inline-block;
      width: 7px;
      height: 15px;
      background: var(--accent);
      margin-left: 2px;
      vertical-align: text-bottom;
      animation: blink 0.8s step-end infinite;
    }

    @keyframes blink {
      50% { opacity: 0; }
    }

    /* ── Input ── */
    .input-area {
      border-top: 1px solid var(--border);
      background: var(--bg-secondary);
      padding: 16px 20px;
      flex-shrink: 0;
    }

    .input-wrap {
      max-width: 780px;
      margin: 0 auto;
      display: flex;
      gap: 10px;
      align-items: flex-end;
    }

    textarea {
      flex: 1;
      font-family: var(--sans);
      font-size: 14px;
      background: var(--bg-input);
      color: var(--text-primary);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 12px 14px;
      resize: none;
      outline: none;
      line-height: 1.5;
      min-height: 44px;
      max-height: 200px;
      transition: border-color 0.15s;
    }

    textarea:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 2px var(--accent-dim);
    }

    textarea::placeholder { color: var(--text-muted); }

    button.send {
      font-family: var(--mono);
      font-size: 12px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      background: var(--accent);
      color: var(--bg-primary);
      border: none;
      border-radius: 6px;
      padding: 12px 20px;
      cursor: pointer;
      transition: all 0.15s;
      white-space: nowrap;
    }

    button.send:hover { filter: brightness(1.1); box-shadow: 0 0 12px var(--accent-glow); }
    button.send:active { transform: scale(0.97); }
    button.send:disabled { opacity: 0.4; cursor: not-allowed; filter: none; box-shadow: none; }

    .mode-toggle { display:inline-flex; border:1px solid var(--border); border-radius:4px; overflow:hidden; }
    .mode-toggle .mode-opt { background:transparent; color:var(--text-secondary); font:600 11px var(--mono); padding:6px 10px; border:0; cursor:pointer; letter-spacing:.08em; text-transform:uppercase; }
    .mode-toggle .mode-opt.active { background:var(--accent); color:var(--bg-primary); }
    details.tokens { font:11px var(--mono); color:var(--text-secondary); }
    details.tokens summary { cursor:pointer; padding:4px 8px; border:1px solid var(--border); border-radius:4px; background:var(--bg-tertiary); }
    details.tokens label { display:block; margin-top:6px; }
    details.tokens input { width:170px; }
    button.clear { background:transparent; color:var(--text-secondary); border:1px solid var(--border); border-radius:4px; padding:6px 10px; cursor:pointer; font:11px var(--mono); text-transform:uppercase; }
    button.clear:hover { color:var(--error); border-color:var(--error); }

    .input-hint {
      max-width: 780px;
      margin: 6px auto 0;
      font-family: var(--mono);
      font-size: 10px;
      color: var(--text-muted);
    }
  </style>
  <script src="https://cdn.jsdelivr.net/npm/marked@12.0.0/marked.min.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/dompurify@3.1.0/dist/purify.min.js" crossorigin="anonymous"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/highlight.js@11.9.0/styles/atom-one-dark.min.css">
  <script src="https://cdn.jsdelivr.net/npm/highlight.js@11.9.0/lib/highlight.min.js"></script>
</head>
<body>

  <header>
    <div class="logo">proxai <span>/ chat</span></div>
    <div class="header-controls">
      <div class="mode-toggle" id="modeToggle" role="radiogroup" aria-label="Mode">
        <button type="button" class="mode-opt active" data-mode="ask">Ask</button>
        <button type="button" class="mode-opt" data-mode="agent">Agent</button>
      </div>
      <select id="modelSelect"><option value="">loading models</option></select>
      <details class="tokens">
        <summary>tokens</summary>
        <label>Ask <input type="password" id="askToken" placeholder="ask token"></label>
        <label>Agent <input type="password" id="agentToken" placeholder="agent token"></label>
      </details>
      <button type="button" id="clearBtn" class="clear">Clear</button>
    </div>
  </header>

  <div class="messages" id="messages">
    <div class="empty-state" id="emptyState">
      <div class="icon">&#9671;</div>
      <div>Send a message to start a session</div>
      <div><code>Shift+Enter</code> for newline</div>
    </div>
  </div>

  <div class="input-area">
    <div class="input-wrap">
      <textarea id="input" rows="1" placeholder="Message…" autofocus></textarea>
      <button class="send" id="sendBtn">Send</button>
    </div>
    <div class="input-hint">enter to send &middot; shift+enter for newline</div>
  </div>

  <script>
const $ = (sel) => document.querySelector(sel);
const messagesEl = $('#messages');
const input = $('#input');
const sendBtn = $('#sendBtn');
const modelSelect = $('#modelSelect');
const askTokenInput = $('#askToken');
const agentTokenInput = $('#agentToken');
const clearBtn = $('#clearBtn');
const modeToggle = $('#modeToggle');

let mode = localStorage.getItem('proxai.mode') || 'ask';
askTokenInput.value = localStorage.getItem('proxai.ask_token') || '';
agentTokenInput.value = localStorage.getItem('proxai.agent_token') || '';
const messageHistory = [];
let inFlight = null;

function setMode(m) {
  mode = m;
  localStorage.setItem('proxai.mode', m);
  for (const b of modeToggle.querySelectorAll('.mode-opt')) {
    b.classList.toggle('active', b.dataset.mode === m);
  }
}
setMode(mode);

modeToggle.addEventListener('click', (e) => {
  const t = e.target.closest('.mode-opt'); if (!t) return;
  setMode(t.dataset.mode);
});
askTokenInput.addEventListener('change', () => localStorage.setItem('proxai.ask_token', askTokenInput.value));
agentTokenInput.addEventListener('change', () => localStorage.setItem('proxai.agent_token', agentTokenInput.value));

function activeToken() { return mode === 'ask' ? askTokenInput.value : agentTokenInput.value; }

function resetTranscript() {
  while (messagesEl.firstChild) messagesEl.removeChild(messagesEl.firstChild);
  const empty = document.createElement('div');
  empty.className = 'empty-state';
  const icon = document.createElement('div'); icon.className = 'icon'; icon.textContent = 'o';
  const tip = document.createElement('div'); tip.textContent = 'Send a message to start a session';
  empty.appendChild(icon); empty.appendChild(tip);
  messagesEl.appendChild(empty);
}

clearBtn.addEventListener('click', () => { messageHistory.length = 0; resetTranscript(); });

input.addEventListener('input', () => { input.style.height = 'auto'; input.style.height = Math.min(input.scrollHeight, 200) + 'px'; });
input.addEventListener('keydown', (e) => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); onSend(); } });
sendBtn.addEventListener('click', () => onSend());

function onSend() { /* implemented in Task 19 */ }
  </script>
</body>
</html>
